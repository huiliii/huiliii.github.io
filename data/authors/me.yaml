bio: |
  I am a Postdoctoral Researcher in the Department of Bioengineering at the University of Pennsylvania, 
  working with Dr. Dani Bassett. My research uses computational and network-based approaches to understand 
  how the human brain develops during the earliest stages of life — from the fetal period through infancy and toddlerhood.

